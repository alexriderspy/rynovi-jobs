name: Refresh jobs

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Once a week (Monday's first run) and on a manual run: look for more company boards in the public
      # new grad and internship lists. A failed lookup keeps last week's list.
      - name: Discover company boards
        run: |
          if [ "$(date -u +%u%H)" = "100" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/discover-boards.mjs || echo "Discovery failed, keeping the last list"
          fi
      - run: node scripts/fetch-jobs.mjs
      - name: Commit if jobs changed
        run: |
          git add scripts/boards.json
          if git diff --quiet -- public/jobs.json && git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "alexriderspy"
          git config user.email "alexriderspy@users.noreply.github.com"
          git add public/jobs.json scripts/boards.json
          git commit -m "Refresh jobs"
          git push
