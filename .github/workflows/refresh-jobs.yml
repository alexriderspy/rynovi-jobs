name: Refresh jobs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-jobs.mjs
      - name: Commit if jobs changed
        run: |
          if git diff --quiet -- public/jobs.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "alexriderspy"
          git config user.email "alexriderspy@users.noreply.github.com"
          git add public/jobs.json
          git commit -m "Refresh jobs"
          git push
